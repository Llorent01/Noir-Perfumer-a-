{% extends "base.html" %}
{% block titulo %}Iniciar sesión — Noir{% endblock %}
{% block contenido %}
  <h1 class="section-title">Iniciar sesión</h1>

  {% if mensaje %}
    <p style="margin-top:1rem; font-size:.85rem; color:var(--accent);">Cuenta creada, ya puedes iniciar sesión.</p>
  {% endif %}

  <form class="form-validar" method="post" action="{{ url_for('auth.login') }}" style="margin-top:2rem;">
    <input type="hidden" name="token" value="{{ token_csrf() }}">
    <div class="field">
      <label for="correo">Correo</label>
      <input type="email" id="correo" name="correo" required>
    </div>
    <div class="field" style="margin-top:1rem;">
      <label for="contrasena">Contraseña</label>
      <input type="password" id="contrasena" name="contrasena" required>
    </div>

    <p class="auth-error">{{ error }}</p>

    <button type="submit" class="btn btn-primary btn-block">Entrar</button>
  </form>

  <p style="margin-top:1.5rem; font-size:.85rem;">¿No tienes cuenta? <a href="{{ url_for('auth.registro') }}" style="text-decoration:underline;">Crear cuenta</a></p>
{% endblock %}
