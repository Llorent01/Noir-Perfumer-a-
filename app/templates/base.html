<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block titulo %}Noir{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='fonts.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<main style="max-width:420px; margin:4rem auto; padding:0 1.25rem;">
  <a href="/" class="logo" aria-label="Noir — Tienda">
    <img src="{{ url_for('static', filename='img/Logo 640px.png') }}" alt="Noir" class="logo-img logo-auth" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';">
    <span class="logo-text" style="display:none;">Noir</span>
  </a>
  {% block contenido %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='validar.js') }}"></script>
</body>
</html>
